# Bu proje, sunucudaki mevcut servislerle (Sliver fwd: 443/8888, PentestPilot
# konsolu: 8443, python gateway: 8089, DB gateway: 5433, CUPS: 631, Tor: 9050)
# çakışmayacak, kasıtlı olarak farklı portlar kullanır. Dışa açma/host port
# eşleme değişiklikleri için ayrıca onay alınmadan, bu compose dosyasındaki
# portlar değiştirilmemelidir.
#
# Kullanım:
#   cp .env.example .env   # değerleri doldurun
#   docker compose up -d --build
#   # Telegram botunu da başlatmak için (opsiyonel):
#   docker compose --profile telegram up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-security_assistant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  # Şu an hiçbir servis tarafından kullanılmıyor — mimari planda
  # (README) belirtilen 'uzun süren görevler için görev kuyruğu'
  # henüz uygulanmadı. İleride eklenecek bir worker için önceden
  # tanımlı; kaldırılması veya gerçek bir kullanım eklenmesi gerekir.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # .env'deki (yerel/docker'sız geliştirme için) CORS_ALLOWED_ORIGINS'i
      # override eder: dockerized frontend 8081'de servis edilir, Vite dev
      # server'ın 5173'ü değil. İkisini de listede tutuyoruz ki dockerized
      # backend'e yerel `npm run dev` ile de bağlanılabilsin.
      CORS_ALLOWED_ORIGINS: "http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173"
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:8010:8000"  # yalnızca localhost; dışa açma ayrı onay gerektirir
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        # Tarayıcı backend'e doğrudan (konteyner ağı üzerinden değil)
        # localhost:8010 üzerinden erişir — bu yüzden backend'in konteyner
        # içi adı değil, host'taki yayınlanmış portu kullanılır.
        VITE_API_BASE_URL: http://localhost:8010/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8081:80"  # yalnızca localhost; dışa açma ayrı onay gerektirir
    networks:
      - internal

  # Opsiyonel: yalnızca `docker compose --profile telegram up` ile başlar.
  # FastAPI sürecinden bağımsız, ayrı bir polling süreci (bkz. README
  # 'Telegram botu'). TELEGRAM_BOT_TOKEN/TELEGRAM_ALLOWED_USER_IDS
  # .env'de boşsa anlamlı bir hatayla durur.
  telegram-bot:
    build: ./backend
    restart: unless-stopped
    # backend servisiyle yarış durumunu önlemek için migration'lar burada
    # da çalıştırılır (idempotent — zaten uygulanmışsa no-op).
    command: ["sh", "-c", "alembic upgrade head && python -m app.telegram.bot"]
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - internal
    profiles:
      - telegram

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
