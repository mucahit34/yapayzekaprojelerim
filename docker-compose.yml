# Bu proje, sunucudaki mevcut servislerle (Sliver fwd: 443/8888, PentestPilot
# konsolu: 8443, python gateway: 8089, DB gateway: 5433, CUPS: 631, Tor: 9050)
# çakışmayacak, kasıtlı olarak farklı portlar kullanır. Dışa açma/host port
# eşleme değişiklikleri için ayrıca onay alınmadan, bu compose dosyasındaki
# portlar değiştirilmemelidir.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-security_assistant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:8010:8000"  # yalnızca localhost; dışa açma ayrı onay gerektirir
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
